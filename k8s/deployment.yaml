apiVersion: apps/v1
kind: Deployment
metadata:
  name: litera
  labels:
    app.kubernetes.io/name: litera
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litera
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litera
    spec:
      containers:
        - name: app
          image: ghcr.io/example/litera:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: litera-config
            - secretRef:
                name: litera-secrets
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
